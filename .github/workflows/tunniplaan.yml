name: Tunniplaani kontroll

on:
  schedule:
    - cron: '17 */2 * * *'   # iga 2 tunni tagant
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kontrolli PERG-i uusimat tunniplaani
        run: python tools/tunniplaan.py
      - name: Salvesta muudatus
        run: |
          if [ -n "$(git status --porcelain tunniplaan.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898828+github-actions[bot]@users.noreply.github.com"
            git add tunniplaan.json
            git commit -m "Tunniplaan: uusim nädal $(python -c "import json;print(json.load(open('tunniplaan.json'))['text'])")"
            git push
          fi
