name: Soovituste teavitus Discordi

on:
  schedule:
    - cron: '17 * * * *'    # varuks kord tunnis; päris käivitaja on cron-job.org (workflow_dispatch iga 2 min), sest GitHubi ajastus hilineb tunde
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: teavita
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Saada uued soovitused Discordi
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          AJUKAS_BOT_PASSWORD: ${{ secrets.AJUKAS_BOT_PASSWORD }}
        run: python tools/teavita.py
