name: Soovituste teavitus Discordi

on:
  schedule:
    - cron: '17 * * * *'    # varuks kord tunnis; päris käivitaja on cron-job.org (workflow_dispatch iga 2 min), sest GitHubi ajastus hilineb tunde
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write   # tunniplaani kontrolli käivitamiseks

concurrency:
  group: teavita
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Saada uued soovitused Discordi
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          AJUKAS_BOT_PASSWORD: ${{ secrets.AJUKAS_BOT_PASSWORD }}
        run: python tools/teavita.py
      - name: Käivita tunniplaani kontroll (umbes iga 20 minuti tagant)
        # cron-job.org käivitab seda tööd iga 2 minuti tagant; GitHubi enda ajastus hilineb tunde
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ $(( 10#$(date -u +%M) % 20 )) -lt 2 ]; then
            # GitHubi API ütleb vahel ajutiselt ära: proovi 3 korda, siis ainult hoiatus (teavitus ise on juba tehtud)
            for i in 1 2 3; do
              gh workflow run tunniplaan.yml --ref main --repo "$GITHUB_REPOSITORY" && { echo "tunniplaani kontroll käivitatud"; exit 0; }
              sleep 10
            done
            echo "::warning::tunniplaani kontroll jäi seekord käivitamata"
          fi
      - name: Käivita uuendusteate kontroll (umbes iga 10 minuti tagant)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ $(( 10#$(date -u +%M) % 10 )) -lt 2 ]; then
            # GitHubi API ütleb vahel ajutiselt ära: proovi 3 korda, siis ainult hoiatus (teavitus ise on juba tehtud)
            for i in 1 2 3; do
              gh workflow run versioon.yml --ref main --repo "$GITHUB_REPOSITORY" && { echo "uuendusteate kontroll käivitatud"; exit 0; }
              sleep 10
            done
            echo "::warning::uuendusteate kontroll jäi seekord käivitamata"
          fi
